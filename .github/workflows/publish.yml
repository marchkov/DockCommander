name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    name: Required tests
    uses: ./.github/workflows/test.yml

  windows:
    name: win-x64
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/DockCommander.App -c Release -r win-x64 --self-contained false -o artifacts/win-x64 --nologo
      - name: Add installer
        run: |
          Copy-Item packaging/check-dotnet.ps1 artifacts/win-x64/
          Copy-Item packaging/windows/install.ps1 artifacts/win-x64/
          Copy-Item packaging/windows/uninstall.ps1 artifacts/win-x64/
      - name: Archive
        run: tar -C artifacts -a -cf DockCommander-win-x64.zip win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: DockCommander-win-x64
          path: DockCommander-win-x64.zip
          if-no-files-found: error

  linux:
    name: linux-x64
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/DockCommander.App -c Release -r linux-x64 --self-contained false -o artifacts/linux-x64 --nologo
      - name: Add installer
        run: |
          cp packaging/check-dotnet.sh packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/dockcommander.desktop icon.png artifacts/linux-x64/
          chmod +x artifacts/linux-x64/DC artifacts/linux-x64/check-dotnet.sh artifacts/linux-x64/install.sh artifacts/linux-x64/uninstall.sh
      - name: Archive
        run: tar -C artifacts -czf "$GITHUB_WORKSPACE/DockCommander-linux-x64.tar.gz" linux-x64
      - name: Package deb
        run: sh packaging/linux/build-deb.sh artifacts/linux-x64 artifacts/DockCommander-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: DockCommander-linux-x64-deb
          path: artifacts/DockCommander-linux-x64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DockCommander-linux-x64
          path: DockCommander-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          prerelease=""
          case "$version" in
            *-alpha*|*-beta*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/DockCommander-win-x64/DockCommander-win-x64.zip \
            dist/DockCommander-linux-x64/DockCommander-linux-x64.tar.gz \
            dist/DockCommander-linux-x64-deb/DockCommander-linux-x64.deb \
            --title "DockCommander $version" \
            --notes-file notes.md \
            $prerelease
          rm -rf published
          mkdir published
          gh release download "$GITHUB_REF_NAME" -D published \
            --clobber \
            -p "DockCommander-win-x64.zip" \
            -p "DockCommander-linux-x64.tar.gz" \
            -p "DockCommander-linux-x64.deb"
          cmp dist/DockCommander-win-x64/DockCommander-win-x64.zip published/DockCommander-win-x64.zip
          cmp dist/DockCommander-linux-x64/DockCommander-linux-x64.tar.gz published/DockCommander-linux-x64.tar.gz
          cmp dist/DockCommander-linux-x64-deb/DockCommander-linux-x64.deb published/DockCommander-linux-x64.deb
          (
            cd published
            sha256sum \
              DockCommander-win-x64.zip \
              DockCommander-linux-x64.tar.gz \
              DockCommander-linux-x64.deb \
              > SHA256SUMS.txt
          )
          gh release upload "$GITHUB_REF_NAME" published/SHA256SUMS.txt --clobber
