name: macOS experimental

# Apple Silicon tests and package. This workflow is not part of the Windows or Linux release gate.
# A push builds the pushed commit and uploads the DMG as a workflow artifact only.
# Attaching that DMG to a GitHub release requires a manual run with a release tag.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Application source git ref. Empty uses the workflow commit.
        required: false
        default: ""
      release_tag:
        description: Existing GitHub release tag that should receive the DMG. Empty does not upload.
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  package:
    name: osx-arm64
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@v4
        with:
          path: packaging-tree
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref != '' && github.event.inputs.source_ref || github.sha }}
          path: source
      - name: Record source commit
        run: |
          set -eu
          sha=$(git -C source rev-parse HEAD)
          echo "Application source: $sha"
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
          case "$GITHUB_REF" in
            refs/tags/v*) test "$sha" = "$GITHUB_SHA" ;;
          esac
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        working-directory: source
        run: dotnet test DockCommander.slnx --nologo
      - name: Package
        run: |
          set -eu
          chmod +x packaging-tree/packaging/macos/package.sh
          sh packaging-tree/packaging/macos/package.sh source artifacts/DockCommander-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DockCommander-macos-arm64
          path: |
            artifacts/DockCommander-macos-arm64.dmg
            artifacts/DockCommander-macos-arm64.dmg.sha256
            artifacts/DockCommander-macos-arm64-EXPERIMENTAL.txt
            artifacts/startup-smoke.log
          if-no-files-found: error
      - name: Publish the macOS artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -eu
          ready=0
          for _ in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null \
              && grep -qx "DockCommander-win-x64.zip" assets.txt \
              && grep -qx "DockCommander-linux-x64.tar.gz" assets.txt \
              && grep -qx "DockCommander-linux-x64.deb" assets.txt; then
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" = 1
          gh release upload "$RELEASE_TAG" artifacts/DockCommander-macos-arm64.dmg --clobber
          rm -rf published
          mkdir published
          gh release download "$RELEASE_TAG" -D published --clobber \
            -p "DockCommander-win-x64.zip" \
            -p "DockCommander-linux-x64.tar.gz" \
            -p "DockCommander-linux-x64.deb" \
            -p "DockCommander-macos-arm64.dmg"
          cmp artifacts/DockCommander-macos-arm64.dmg published/DockCommander-macos-arm64.dmg
          (
            cd published
            sha256sum \
              DockCommander-win-x64.zip \
              DockCommander-linux-x64.tar.gz \
              DockCommander-linux-x64.deb \
              DockCommander-macos-arm64.dmg \
              > SHA256SUMS.txt
          )
          gh release upload "$RELEASE_TAG" published/SHA256SUMS.txt --clobber
